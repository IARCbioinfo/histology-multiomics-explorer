[project]
name = "histology-multiomics-explorer-mcp"
version = "0.2.0"
description = "Read-only MCP server for the Tumour Histology and Multi-omics Explorer catalogue metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Matthieu Foll" }]
dependencies = [
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://iarcbioinfo.github.io/histology-multiomics-explorer/"
Repository = "https://github.com/IARCbioinfo/histology-multiomics-explorer"
Issues = "https://github.com/IARCbioinfo/histology-multiomics-explorer/issues"

[project.scripts]
histology-multiomics-explorer-mcp = "explorer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorer_mcp"]
